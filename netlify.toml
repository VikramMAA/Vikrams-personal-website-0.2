[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The contact form handler. It mounts itself at /api/contact via the `config`
# export inside the function, so there is no redirect rule to keep in sync.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The previous Hugo site served posts at /blogs/<slug>/; this site uses /blog/.
# Keep the old URLs alive so existing links and rankings carry over.
[[redirects]]
  from = "/blogs/*"
  to = "/blog/:splat"
  status = 301

# Security + SEO headers. Netlify serves these on every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Hashed build assets are immutable — cache them hard.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
