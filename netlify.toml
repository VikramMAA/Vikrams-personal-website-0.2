[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The contact form handler. It mounts itself at /api/contact via the `config`
# export inside the function, so there is no redirect rule to keep in sync.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The previous Hugo site served posts at /blogs/<slug>/; this site uses /blog/.
# Keep the old URLs alive so existing links and rankings carry over.
[[redirects]]
  from = "/blogs/*"
  to = "/blog/:splat"
  status = 301

# The site used to have a /services/ section. It is now a personal blog and
# portfolio, so those pages became expertise notes under /expertise/. Named
# services map one-to-one; the training page folded into
# marketing-sales-alignment.
[[redirects]]
  from = "/services/marketing-sales-training/*"
  to = "/expertise/marketing-sales-alignment/"
  status = 301

[[redirects]]
  from = "/services/*"
  to = "/expertise/:splat"
  status = 301

# /topics/ was the working name for /expertise/ and never shipped. Kept only so
# branch-preview links do not dead-end.
[[redirects]]
  from = "/topics/*"
  to = "/expertise/:splat"
  status = 301

# /results/ was renamed to /portfolio/ in the same pass.
[[redirects]]
  from = "/results/*"
  to = "/portfolio/"
  status = 301

# Security + SEO headers. Netlify serves these on every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Hashed build assets are immutable — cache them hard.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# IndexNow verification key. Bing checks for this file at the site root and
# requires it served as plain text, so pin the type rather than relying on the
# default for .txt.
[[headers]]
  for = "/e58f7130a5c44681a4c97c7b4cb87986.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
